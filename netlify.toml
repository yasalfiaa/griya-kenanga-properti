[build]
  command = "npm run build"
  publish = ".next"
  environment = { SECRETS_SCAN_OMIT_KEYS = "MAYAR_BASE_URL" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security and Privacy Headers (PRD Non-Fungsional: internal app, noindex)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
